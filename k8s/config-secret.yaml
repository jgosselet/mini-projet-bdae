apiVersion: v1
kind: ConfigMap
metadata:
  name: sentiment-config
data:
  MODEL_VERSION: "v1"
  POSTGRES_DB: "sentiment_db"
  POSTGRES_USER: "sentiment_user"
---
apiVersion: v1
kind: Secret
metadata:
  name: sentiment-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: "sentiment_password"
  DATABASE_URL: "postgresql://sentiment_user:sentiment_password@postgres-service:5432/sentiment_db"